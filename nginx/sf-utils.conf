server {
    listen 80;
    server_name docs.local;  # change to your hostname, or use `_` as a catch-all

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # Forward real client identity so Fastify/Pino logs the actual visitor,
        # not the Nginx process (requires trustProxy: true in server.js).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
